<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171719" />
    <meta
      name="description"
      content="S-IDE is a lightweight, zero-dependency browser IDE for opening workspaces, editing code, and running commands."
    />
    <title>S-IDE — Browser IDE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="titlebar">
        <div class="brand-cluster">
          <button class="brand-mark" type="button" aria-label="Open workspace menu" id="workspace-menu-button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2.8 14.1 9l5.9 2.1-5.9 2.1-2.1 6.2-2.1-6.2L4 11.1 9.9 9 12 2.8Z" />
            </svg>
          </button>
          <div class="brand-copy">
            <span class="brand-name">S-IDE</span>
            <span class="workspace-name">demo-workspace</span>
          </div>
        </div>

        <div class="titlebar-actions">
          <button class="text-button" type="button" id="open-folder-button" title="Open Folder">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4.5 6h5l2 2h8v10h-15v-12Z" />
              <path d="M4.5 10h15" />
            </svg>
            Open Folder
          </button>
          <button class="command-trigger" type="button" id="command-trigger">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m20 20-4.3-4.3m1.8-5.2a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" />
            </svg>
            <span>Quick open</span>
            <kbd>⌘ P</kbd>
          </button>
          <button class="text-button" type="button" id="run-button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m8 5 11 7-11 7V5Z" />
            </svg>
            Run
          </button>
          <button class="profile-button" type="button" aria-label="Open profile menu" id="profile-button">TT</button>
        </div>
      </header>

      <div class="workspace">
        <nav class="activity-rail" aria-label="Primary">
          <div class="rail-group">
            <button class="rail-button is-active" type="button" data-panel="explorer" aria-label="Explorer" aria-current="page" title="Explorer">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4.5 5.5h6l2 2h7v11h-15v-13Z" />
                <path d="M4.5 9.5h15" />
              </svg>
            </button>
            <button class="rail-button" type="button" data-panel="search" aria-label="Search" title="Search">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m20 20-4.3-4.3m1.8-5.2a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" />
              </svg>
            </button>
            <button class="rail-button" type="button" data-panel="source" aria-label="Source control" title="Source control">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="6.5" cy="6.5" r="2.5" />
                <circle cx="17.5" cy="6.5" r="2.5" />
                <circle cx="17.5" cy="17.5" r="2.5" />
                <path d="M9 6.5h6M6.5 9v5.5a3 3 0 0 0 3 3h5.5" />
              </svg>
              <span class="rail-count">2</span>
            </button>
            <button class="rail-button" type="button" data-panel="run" aria-label="Run and debug" title="Run and debug">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m8 5 11 7-11 7V5Z" />
                <path d="M4 4v16" />
              </svg>
            </button>
            <button class="rail-button" type="button" data-panel="extensions" aria-label="Extensions" title="Extensions">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 4H5a1 1 0 0 0-1 1v3h4v4H4v3a1 1 0 0 0 1 1h3v4h3v-4h4v4h3a1 1 0 0 0 1-1v-3h-4v-4h4V5a1 1 0 0 0-1-1h-3v4h-4V4H8Z" />
              </svg>
            </button>
          </div>
          <div class="rail-group rail-group-bottom">
            <button class="rail-button" type="button" aria-label="Settings" title="Settings" id="settings-button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m12 3 1 2.3 2.5.8 2.2-1.2 1.4 1.4-1.2 2.2.8 2.5L21 12l-2.3 1-.8 2.5 1.2 2.2-1.4 1.4-2.2-1.2-2.5.8L12 21l-1-2.3-2.5-.8-2.2 1.2-1.4-1.4 1.2-2.2-.8-2.5L3 12l2.3-1 .8-2.5-1.2-2.2 1.4-1.4 2.2 1.2 2.5-.8L12 3Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
            <button class="rail-button" type="button" aria-label="Help" title="Help" id="help-button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9" />
                <path d="M9.7 9a2.4 2.4 0 0 1 4.6 1c0 1.7-2.3 2-2.3 3.6M12 17.1v.1" />
              </svg>
            </button>
          </div>
        </nav>

        <aside class="sidebar-panel" id="sidebar-panel" aria-label="Workspace navigation"></aside>

        <main class="main-stage">
          <section class="editor-column" aria-label="Editor">
            <div class="tab-strip" id="tab-strip"></div>
            <div class="editor-toolbar">
              <div class="editor-heading-group">
                <h1 class="screen-title">demo-workspace</h1>
                <div class="breadcrumbs" id="breadcrumbs"></div>
              </div>
              <div class="editor-toolbar-actions">
                <button class="toolbar-button" type="button" id="save-button">Save</button>
                <button class="toolbar-icon" type="button" id="split-editor-button" aria-label="Split editor" title="Split editor">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="4" y="5" width="16" height="14" rx="1.5" />
                    <path d="M12 5v14" />
                  </svg>
                </button>
                <button class="toolbar-icon" type="button" id="more-editor-button" aria-label="More editor actions" title="More editor actions">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="5" cy="12" r="1.4" />
                    <circle cx="12" cy="12" r="1.4" />
                    <circle cx="19" cy="12" r="1.4" />
                  </svg>
                </button>
              </div>
            </div>

            <div class="editor-surface">
              <div class="line-number-column" id="line-numbers" aria-hidden="true"></div>
              <textarea
                class="code-editor"
                id="code-editor"
                spellcheck="false"
                autocapitalize="off"
                autocomplete="off"
                aria-label="Code editor"
              ></textarea>
              <div class="minimap" aria-hidden="true" id="minimap"></div>
            </div>

            <section class="terminal-panel" id="terminal-panel" aria-label="Terminal">
              <div class="terminal-header">
                <div class="terminal-tabs">
                  <button class="terminal-tab is-active" type="button" data-terminal-tab="terminal">Terminal</button>
                  <button class="terminal-tab" type="button" data-terminal-tab="problems">Problems <span class="tab-count">0</span></button>
                  <button class="terminal-tab" type="button" data-terminal-tab="output">Output</button>
                </div>
                <div class="terminal-actions">
                  <span class="terminal-scope">zsh · demo-workspace</span>
                  <button class="toolbar-icon" type="button" id="clear-terminal" aria-label="Clear terminal" title="Clear terminal">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M5 7h14M10 10v7m4-7v7M7 7l1 12h8l1-12M9 7l1-2h4l1 2" />
                    </svg>
                  </button>
                  <button class="toolbar-icon" type="button" id="collapse-terminal" aria-label="Collapse terminal" title="Collapse terminal">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <path d="m6 10 6 6 6-6" />
                    </svg>
                  </button>
                </div>
              </div>
              <div class="terminal-output" id="terminal-output" aria-live="polite"></div>
              <form class="terminal-form" id="terminal-form">
                <span class="terminal-prompt">$</span>
                <input id="terminal-input" aria-label="Terminal command" autocomplete="off" spellcheck="false" placeholder="Type a command" />
              </form>
            </section>
          </section>

          <aside class="inspector-panel" aria-label="Code insights">
            <section class="inspector-section">
              <div class="inspector-heading">
                <span>Outline</span>
                <button class="toolbar-icon" type="button" aria-label="Collapse outline" title="Collapse outline">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 10 6 6 6-6" /></svg>
                </button>
              </div>
              <div class="outline-list" id="outline-list"></div>
            </section>
            <section class="inspector-section">
              <div class="inspector-heading">
                <span>Open editors</span>
                <span class="section-meta" id="open-editors-count">3</span>
              </div>
              <div class="open-editor-list" id="open-editor-list"></div>
            </section>
            <section class="inspector-section inspector-section-grow">
              <div class="inspector-heading">
                <span>Activity</span>
                <span class="section-meta">Today</span>
              </div>
              <div class="activity-note">
                <span class="activity-dot"></span>
                <div>
                  <strong>Workspace ready</strong>
                  <p>Files are local and safe to edit.</p>
                </div>
              </div>
              <div class="activity-note">
                <span class="activity-dot activity-dot-muted"></span>
                <div>
                  <strong>Last run</strong>
                  <p id="last-run-note">No run yet</p>
                </div>
              </div>
            </section>
          </aside>
        </main>
      </div>

      <footer class="statusbar">
        <div class="status-left">
          <span class="status-item status-branch">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 5.5v10a3 3 0 0 0 3 3h5M6.5 5.5h10M6.5 5.5l-2 2m2-2 2 2M15.5 18.5l2-2m-2 2-2-2" /></svg>
            main
          </span>
          <span class="status-item">2 changes</span>
          <span class="status-item status-hide-small">Ln <span id="cursor-line">1</span>, Col <span id="cursor-column">1</span></span>
        </div>
        <div class="status-right">
          <span class="status-item status-hide-small">Spaces: 2</span>
          <span class="status-item status-hide-small">UTF-8</span>
          <span class="status-item" id="language-status">JavaScript</span>
          <span class="status-item status-check">Ready</span>
        </div>
      </footer>
    </div>

    <div class="modal-backdrop is-hidden" id="command-palette" role="presentation">
      <section class="command-palette" role="dialog" aria-modal="true" aria-labelledby="command-palette-title">
        <div class="palette-search-row">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m20 20-4.3-4.3m1.8-5.2a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" />
          </svg>
          <input id="command-input" aria-label="Search commands" placeholder="Search commands" autocomplete="off" />
          <kbd>Esc</kbd>
        </div>
        <div class="palette-heading" id="command-palette-title">Commands</div>
        <div class="command-list" id="command-list"></div>
        <div class="palette-footer"><span>↑ ↓ to navigate</span><span>Enter to run</span></div>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js" defer></script>
  </body>
</html>
